# nginx site config for Phuong Hair Studio.
#
# Install:  sudo cp deploy/nginx/my-phuong.conf /etc/nginx/sites-available/my-phuong
#           sudo ln -s /etc/nginx/sites-available/my-phuong /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# What nginx does here:
#   /api/...      -> passed on ("proxied") to the Node API on 127.0.0.1:3000
#   everything    -> served straight from the Angular build in /var/www/my-phuong
#   else
#
# HTTPS: once a real domain points at the server, run `sudo certbot --nginx -d yourdomain`.
# Certbot edits this file to add `listen 443 ssl` and the certificate lines for you.

# Rate limit for the staff login, to slow down password guessing. Each client IP gets
# 5 tries a minute; the "10m" is memory for tracking IPs (enough for ~160k of them).
# This line has to be outside `server {}`; sites-enabled files are included inside `http {}`.
limit_req_zone $binary_remote_addr zone=my_phuong_login:10m rate=5r/m;

# A name for the Node backend so `proxy_pass` lines below stay short.
upstream my_phuong_api {
    server 127.0.0.1:3000;
}

server {
    # Port 80 = plain HTTP, for both IPv4 and IPv6.
    listen 80;
    listen [::]:80;

    # Which hostnames this block answers for. Change to your domain later, e.g.
    #   server_name phuonghair.com.au www.phuonghair.com.au;
    server_name localhost;

    # Where the built Angular files live (copied from dist/my-phuong/browser).
    root /var/www/my-phuong;
    index index.html;

    # Bookings are small JSON bodies; refuse anything big.
    client_max_body_size 16k;

    # Compress text responses. Ubuntu's main nginx.conf turns gzip on but only for HTML.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers on every response. Gotcha: if a `location` below uses `add_header`
    # itself, it stops inheriting these, so the locations only use `expires` instead.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Headers sent on to Node so it knows the real visitor, not just "nginx on localhost".
    # Set here once; every location with proxy_pass inherits them.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # `=` means exactly this path. More specific than /api/ below, so it wins for login.
    location = /api/admin/login {
        # Allow a short burst of 5, then answer 429 Too Many Requests.
        limit_req zone=my_phuong_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://my_phuong_api;
    }

    # Everything else under /api/ goes to Node. `^~` = if this prefix matches, skip the
    # regex locations below (so an API URL ending in .js can never be treated as a file).
    location ^~ /api/ {
        proxy_pass http://my_phuong_api;
    }

    # Angular puts a content hash in built file names (main-AEZL4RFC.js), so a changed file
    # always gets a new name. That makes it safe for browsers to cache them for a year.
    # `~` = regular expression match.
    location ~ "-[A-Za-z0-9_-]{8}\.(js|css)$" {
        expires 1y;
        try_files $uri =404;
    }

    # index.html must never be cached, or visitors keep loading old file names after a deploy.
    location = /index.html {
        expires -1;
    }

    # Angular handles routes like /book and /booking/MP-7K3QXD in the browser. If no real
    # file matches, hand back index.html and let Angular's router show the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
